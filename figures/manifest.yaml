figures:
  - id: m11-mixer-complexity
    file: m11-mixer-complexity.svg
    concepts: ["11.13"]
    caption: "不同 token mixer 的每层计算量随上下文长度的增长；虚线标出 T≈2D 的交叉点。示意，非实测。"
    alt: "全 attention、SWA、线性 attention、SSM 的计算量随上下文长度变化"
  - id: m11-mamba-state
    file: m11-mamba-state.svg
    concepts: ["11.14"]
    caption: "选择性 SSM 的写/忘/读：Δ、B、C 由输入决定，状态固定，不需要 KV Cache。"
    alt: "Mamba 的选择性状态更新流程图"
  - id: m11-linear-attention
    file: m11-linear-attention.svg
    concepts: ["11.15"]
    caption: "左：softmax attention 的 T×T 分数矩阵；右：线性 attention 先累加 D×D 状态，再用 query 读。"
    alt: "softmax attention 与线性 attention 的状态累加对比"
  - id: m11-hybrid-layers
    file: m11-hybrid-layers.svg
    concepts: ["11.16"]
    caption: "LFM3 的 24 层预算：13 层 shortconv、5 层 SWA、6 层 global；分组示意，不表示真实层序。"
    alt: "LFM3 的短卷积、SWA、全局注意力层数占比"
  - id: m11-long-context
    file: m11-long-context.svg
    concepts: ["11.17"]
    caption: "7B 模型 KV/状态随上下文长度的增长：全 attention 线性增长，SWA/SSM 近似常数。示意值。"
    alt: "全 attention、SWA、SSM 的 KV 或状态显存随上下文长度变化"
  - id: m11-arch-tradeoff
    file: m11-arch-tradeoff.svg
    concepts: ["11.18"]
    caption: "128k 下的显存与计算量级对比：全 attention 最贵，SWA/线性/SSM/混合各有取舍。示意值，非实测。"
    alt: "五种架构在 128k 上下文下的显存与计算量对比"
  - id: projection
    file: projection.svg
    concepts: ["1.6"]
    caption: "把 x 投影到 u 的方向：橙色是投影 p，灰色虚线是垂直残差 x−p。"
    alt: "向量 x 在 u 方向上的投影示意，投影向量与残差垂直"
  - id: determinant
    file: determinant.svg
    concepts: ["5.1"]
    caption: "单位正方形经过 A 变成平行四边形；面积从 1 变为 |det A|=3。"
    alt: "单位正方形被矩阵映射为面积 3 的平行四边形"
  - id: eigenvectors
    file: eigenvectors.svg
    concepts: ["6.1"]
    caption: "网格被 A 拉伸后，特征方向上的向量只改变长度，不改变方向。"
    alt: "网格变形与两条特征方向，特征值 3 和 1"
  - id: svd
    file: svd.svg
    concepts: ["7.1"]
    caption: "SVD 把单位圆映射成椭圆；半轴长度就是奇异值 σ₁、σ₂。"
    alt: "单位圆经过矩阵 A 变成椭圆，标出两个奇异值"
  - id: pca
    file: pca.svg
    concepts: ["9.3"]
    caption: "PCA 找到方差最大的方向；把点投影到第一主轴上，残差最小。"
    alt: "二维点云与两条主成分轴，一个点投影到第一主轴"
  - id: softmax-temperature
    file: softmax-temperature.svg
    concepts: ["11.11"]
    caption: "同一个 logits 向量在不同温度下的 softmax：T 越小越尖锐，T 越大越平坦。"
    alt: "三组柱状图展示 softmax 随温度变化的分布"
  - id: rope
    file: rope.svg
    concepts: ["11.5"]
    caption: "RoPE 用位置乘以角度旋转 Q/K；相对位置体现为旋转角之差。"
    alt: "四个位置对应的旋转向量与角度弧"
  - id: kv-cache
    file: kv-cache.svg
    concepts: ["11.7"]
    caption: "KV Cache 显存随序列长度线性增长；T=4096 时约 2 GB（示例配置）。"
    alt: "KV cache 显存随序列长度线性增长的折线图"
  # 以下为正文内联图：inline: true，概念页不会自动插到页首。
  - id: transformer-pipeline
    file: transformer-pipeline.svg
    concepts: ["0.1"]
    inline: true
    caption: "一个 token 的旅程：文本 → token id → embedding → 位置编码 → L 层 Transformer → logits → softmax。"
    alt: "token 经过 Transformer 各阶段的流程图"
  - id: vector-add
    file: vector-add.svg
    concepts: ["1.2"]
    inline: true
    caption: "把 v 的起点移到 u 的终点；虚线补出平行四边形，对角线就是 u+v。"
    alt: "两个向量首尾相接相加的平行四边形示意"
  - id: scalar-multiple
    file: scalar-multiple.svg
    concepts: ["1.2"]
    inline: true
    caption: "数乘只改变长度和正负：1.8v 拉长、0.5v 缩短、−1.3v 反向，但都留在 v 所在的直线上。"
    alt: "同一个向量的不同数乘结果都落在一条直线上"
  - id: linear-combination
    file: linear-combination.svg
    concepts: ["1.2"]
    inline: true
    caption: "左：两个正系数把 w 夹在 v₁、v₂ 之间；右：负系数让第二项反向，w 跑到另一侧。"
    alt: "正系数与含负系数的线性组合对比"
  - id: span-grid
    file: span-grid.svg
    concepts: ["1.2"]
    inline: true
    caption: "左边每选一组系数 (c₁,c₂)，右边就落在一个向量上；系数窗口放大到整个平面，组合就铺满张成。"
    alt: "系数平面中的网格映射为向量平面中铺满的张成网格"
  - id: cross-product
    file: cross-product.svg
    concepts: ["1.7"]
    inline: true
    caption: "a、b 张成的平行四边形是浅色平面；叉积沿法线方向，长度等于面积。"
    alt: "叉积垂直于 a、b 平面且长度等于平行四边形面积"
  - id: least-squares
    file: least-squares.svg
    concepts: ["4.4"]
    inline: true
    caption: "从 y 向列空间作垂线，垂足就是最小二乘解 ŷ。"
    alt: "最小二乘把 y 投影到列空间"
  - id: condition-number
    file: condition-number.svg
    concepts: ["4.6"]
    inline: true
    caption: "单位圆经过病态矩阵 A 变成扁椭圆，κ = σmax/σmin = 8。"
    alt: "病态矩阵把单位圆压成扁椭圆"
  - id: covariance-sign
    file: covariance-sign.svg
    concepts: ["9.1"]
    inline: true
    caption: "左：正相关，点云沿右上方向拉长；右：负相关，沿右下方向拉长。"
    alt: "正相关与负相关的二维点云对比"
  - id: gaussian-contours
    file: gaussian-contours.svg
    concepts: ["9.2"]
    inline: true
    caption: "二元高斯的等高线是以 μ 为中心的同心椭圆，轴长是 √λi。"
    alt: "二元高斯分布的同心椭圆等高线"
  - id: whitening
    file: whitening.svg
    concepts: ["9.4"]
    inline: true
    caption: "三步：原斜椭圆 → PCA 白化成正圆并转正 → ZCA 白化成正圆但方向不变。"
    alt: "白化前后协方差椭圆的变化"
  - id: rotation
    file: rotation.svg
    concepts: ["0.1"]
    inline: true
    caption: "R 把每个向量逆时针转 90°；连续作用两次得到 R²=−I，也就是 180° 旋转。"
    alt: "二维旋转矩阵对两个向量的作用，以及连续两次旋转的结果"
  - id: norm-balls
    file: norm-balls.svg
    concepts: ["1.4"]
    inline: true
    caption: "同一个方向与三个单位球相交于不同位置；「长度 1」在 L1/L2/L∞ 下分别是菱形、圆、正方形。"
    alt: "L1、L2、L∞ 三种范数的单位球形状对比"
  - id: cosine-angle
    file: cosine-angle.svg
    concepts: ["1.5"]
    inline: true
    caption: "余弦相似度就是单位向量在 x 方向上的投影长度；这里 cosθ=0.6。"
    alt: "两个向量的夹角与余弦投影示意"
  - id: span-membership
    file: span-membership.svg
    concepts: ["2.2"]
    inline: true
    caption: "左：b 在张成平面内，存在精确配方；右：b 在平面外，垂足 p 是张成里离它最近的点。"
    alt: "目标向量在张成内与张成外的对比，含最近点投影"
  - id: span-independence
    file: span-independence.svg
    concepts: ["2.3"]
    inline: true
    caption: "左：v₂=1.5v₁ 时所有组合落在一条直线上；右：两个无关向量的组合铺满整个平面。"
    alt: "线性相关与线性无关的张成空间对比"
  - id: inverse-singular
    file: inverse-singular.svg
    concepts: ["3.4"]
    inline: true
    caption: "左：可逆矩阵把单位正方形变成仍有面积的平行四边形；右：奇异矩阵把平面压成一条线，不同输入映到同一输出。"
    alt: "可逆矩阵与奇异矩阵对平面的作用对比"
  - id: quadratic-form
    file: quadratic-form.svg
    concepts: ["6.5"]
    inline: true
    caption: "左：正定二次型是开口向上的碗；右：不定二次型是鞍面，沿特征方向一上一下。"
    alt: "正定与不定二次型的等高线对比"
  - id: power-iteration
    file: power-iteration.svg
    concepts: ["6.6"]
    inline: true
    caption: "反复乘 A 并归一化，方向被主特征向量 v₁ 吸过去；收敛比 r≈0.24。"
    alt: "幂迭代的向量方向逐步收敛到主特征向量"
  - id: convexity
    file: convexity.svg
    concepts: ["8.6"]
    inline: true
    caption: "左：凸函数的弦始终在图像上方；右：非凸函数会出现图像高于弦的区间。"
    alt: "凸函数与非凸函数的弦位置对比"
  - id: gradient-descent
    file: gradient-descent.svg
    concepts: ["8.7"]
    inline: true
    caption: "同一个扁碗：梯度下降沿长轴之字形前进，牛顿法用 Hessian 一步到中心。"
    alt: "梯度下降与牛顿法在扁二次函数上的路径对比"
  - id: attention-mask
    file: attention-mask.svg
    concepts: ["11.4"]
    inline: true
    caption: "因果 mask 把上三角置 −∞，softmax 后第 i 行只在前 i 列分配预算，每行和为 1。"
    alt: "带因果 mask 的注意力分数与 softmax 权重热力图"
  - id: quantization-levels
    file: quantization-levels.svg
    concepts: ["11.9"]
    inline: true
    caption: "量化把连续值吸到最近的刻度；步长 s=1/7 时最大误差不超过 s/2。"
    alt: "连续值映射到均匀量化网格的示意"
  - id: dot-product
    file: dot-product.svg
    concepts: ["1.3"]
    inline: true
    caption: "y 的长度乘 x 在 y 方向上的影子长度就是点积；这里 2.12×1.41=3。"
    alt: "点积作为 y 的长度与 x 的投影长度之积"
  - id: change-of-basis
    file: change-of-basis.svg
    concepts: ["2.5"]
    inline: true
    caption: "同一个向量的坐标随基改变：标准基下是 (1.2,1.0)，在另一组基下是 (1.36,0.32)。"
    alt: "同一向量在标准网格与斜基网格下的坐标"
  - id: gram-schmidt
    file: gram-schmidt.svg
    concepts: ["2.7"]
    inline: true
    caption: "从 v₂ 中减掉它在 v₁ 上的投影，剩下的红色向量与 v₁ 垂直；单位化后得到 q₂。"
    alt: "Gram-Schmidt 通过减去投影构造正交方向"
  - id: matrix-vector-columns
    file: matrix-vector-columns.svg
    concepts: ["3.2"]
    inline: true
    caption: "Ax 是按输入系数把矩阵各列加权相加；输入 (1,2) 取 1 份 a₁ 和 2 份 a₂。"
    alt: "矩阵乘向量作为列向量的加权和"
  - id: matrix-composition
    file: matrix-composition.svg
    concepts: ["3.3"]
    inline: true
    caption: "先作用 B 再作用 A，与直接乘 AB 得到同一个像；图用 2×2 矩阵演示复合结构。"
    alt: "两个线性变换的复合与乘积矩阵的等价性"
  - id: system-geometry
    file: system-geometry.svg
    concepts: ["4.1"]
    inline: true
    caption: "两条约束线交于一点、平行或重合，分别对应唯一解、无解、无穷多解。"
    alt: "线性方程组三种解的几何情形"
  - id: solution-structure
    file: solution-structure.svg
    concepts: ["4.2"]
    inline: true
    caption: "通解是一条直线：特解 x_p 加上零空间方向 n 的任意倍数仍落在解集上。"
    alt: "特解加零空间方向构成通解"
  - id: jacobian-polar
    file: jacobian-polar.svg
    concepts: ["5.4"]
    inline: true
    caption: "极坐标把 (r,θ) 方格映射成扇形小格；在半径 r 处面积放大 r 倍。"
    alt: "极坐标映射的网格与局部面积缩放"
  - id: low-rank
    file: low-rank.svg
    concepts: ["7.3"]
    inline: true
    caption: "合成矩阵的截断 SVD：保留前 1、2、4 层时，相对误差约为 29%、10%、2%。"
    alt: "同一矩阵的 rank-1、rank-2、rank-4 重建对比"
  - id: gradient-field
    file: gradient-field.svg
    concepts: ["8.1"]
    inline: true
    caption: "梯度箭头垂直等高线并指向函数增大的方向；这里 f=(x₁²+2x₂²)/2。"
    alt: "等高线与梯度向量场"
  - id: lagrange
    file: lagrange.svg
    concepts: ["8.8"]
    inline: true
    caption: "最优点处目标等值线与约束圆相切，∇f 与 ∇g 平行。"
    alt: "约束圆、目标等值线与梯度平行的切点"
  - id: float-spacing
    file: float-spacing.svg
    concepts: ["10.1"]
    inline: true
    caption: "fp32 的相邻间距每个 2 的幂区间翻倍；在 1 附近是 2⁻²³，在 1024 附近是 2⁻¹³。"
    alt: "浮点数相邻间距随数量级增长的阶梯图"
  - id: roofline
    file: roofline.svg
    concepts: ["10.3"]
    inline: true
    caption: "fp32 与 bf16 的两条 Roofline，拐点分别为 10 和 150 FLOP/byte；4096 GEMM 落在计算受限区。"
    alt: "带宽斜线与算力平台组成的 Roofline 模型"
  - id: sparse-pattern
    file: sparse-pattern.svg
    concepts: ["10.5"]
    inline: true
    caption: "同样 284 个非零元：按块/带排列便于硬件跳过，随机排列则索引不规则。"
    alt: "结构化稀疏与随机稀疏的非零元分布对比"
  - id: layernorm-rmsnorm
    file: layernorm-rmsnorm.svg
    concepts: ["11.6"]
    inline: true
    caption: "D=2 时 LayerNorm 把输出压到零均值线与球的交点，RMSNorm 只把输出重定到同一半径的圆上。"
    alt: "LayerNorm 与 RMSNorm 输出所在几何位置的对比"
  - id: lora
    file: lora.svg
    concepts: ["11.8"]
    inline: true
    caption: "LoRA 冻结 W，只训练 A（r×D）与 B（D×r）；D=4096、r=16 时参数量约 0.78%。"
    alt: "全参数微调与 LoRA 低秩瓶颈结构的参数对比"
  - id: einsum
    file: einsum.svg
    concepts: ["12.1"]
    inline: true
    caption: "bhid,bhjd->bhij：b,h 共享保留，d 被求和，i,j 是输出保留的自由轴。"
    alt: "einsum 下标中共享轴、自由轴与求和轴的对应关系"
  - id: random-matrix
    file: random-matrix.svg
    concepts: ["12.2"]
    inline: true
    caption: "n=600、元素方差 1/n 的对称随机矩阵，特征值大多落在 [−2,2]，与 Wigner 半圆律吻合。"
    alt: "随机对称矩阵特征值直方图与 Wigner 半圆律"
  - id: basis-dimension
    file: basis-dimension.svg
    concepts: ["2.4"]
    inline: true
    caption: "左：两条无关方向 b1,b2 足以表示平面上任意向量；右：加入 b3=b1+b2 后仍只有 2 维，v 的坐标不再唯一。"
    alt: "基的两条无关方向与加入相关向量后的坐标不唯一"
  - id: orthogonal-complement
    file: orthogonal-complement.svg
    concepts: ["2.8"]
    inline: true
    caption: "S 是一张平面（侧视成菱形），S⊥ 是它的法线；任意 v 唯一拆成 p∈S 与 e∈S⊥，维数 2+1=3。"
    alt: "平面 S、法线 S⊥ 与向量 v=p+e 的正交分解"
  - id: min-norm
    file: min-norm.svg
    concepts: ["4.5"]
    inline: true
    caption: "所有解在 x1+2x2=3 上；以原点为圆心的圆与直线相切于 p=(0.6,1.2)，所以 p 是范数最小的解。"
    alt: "解集直线与原点圆相切于最小范数解"
  - id: diagonalization
    file: diagonalization.svg
    concepts: ["6.3"]
    inline: true
    caption: "A 把 x=0.7v1+0.9v2 变成 Ax=1.4v1+2.7v2；在特征基下只剩坐标各自乘 λ1=2、λ2=3。"
    alt: "标准坐标与特征基下同一向量及其像的分解"
  - id: hessian-approximation
    file: hessian-approximation.svg
    concepts: ["8.4"]
    inline: true
    caption: "p 处沿两个特征方向的切片：实线是真实 f，虚线是二阶模型；两者在 p 附近贴合，曲率由 λ1≈1.25、λ2≈2.81 决定。"
    alt: "Hessian 特征方向上的真实函数与二次近似切片"
  - id: conjugate-gradient
    file: conjugate-gradient.svg
    concepts: ["10.4"]
    inline: true
    caption: "同一个二次函数、同一个起点：GD 在狭长山谷里之字形前进，CG 用两个共轭方向两步到达解。"
    alt: "梯度下降的之字形路径与共轭梯度两步路径对比"
  - id: qkv-shapes
    file: qkv-shapes.svg
    concepts: ["11.3"]
    inline: true
    caption: "X[T,D] 经 WQ/WK/WV 投到每头 d=D/H；QK^T 给出 [H,T,T] 分数，softmax 后乘 V 得到 [H,T,d]，拼接回 [T,D]。"
    alt: "QKV 投影、多头分数、softmax 与输出拼接的形状流"
