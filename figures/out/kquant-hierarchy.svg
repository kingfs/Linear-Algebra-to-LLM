<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="sans-serif">
<rect width="800" height="320" fill="#fffdf8"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2933">K-quants 超级块的层次（256 值）</text>
<text x="20" y="50" font-size="12" fill="#52606d">全局尺度 d、dmin + 8 个子块各自的 s_j、m_j；qs 为 4-bit 码</text>
<rect x="20" y="65" width="760" height="190" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="30" y="85" font-size="13" fill="#1f2933">超级块 256 值 · 144 字节（Q4_K）</text>
<text x="30" y="105" font-size="12" fill="#52606d">d (fp16) + dmin (fp16) + scales[12]（8 对 6-bit）+ qs[128]</text>
<rect x="30" y="120" width="82" height="110" rx="4" fill="#fffdf8" stroke="#7b8794" stroke-width="1"/>
<text x="71" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 0</text>
<text x="71" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="71" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s0 · m0</text>
<text x="71" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="71" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="122" y="120" width="82" height="110" rx="4" fill="#e6efff" stroke="#7b8794" stroke-width="1"/>
<text x="163" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 1</text>
<text x="163" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="163" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s1 · m1</text>
<text x="163" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="163" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="214" y="120" width="82" height="110" rx="4" fill="#fffdf8" stroke="#7b8794" stroke-width="1"/>
<text x="255" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 2</text>
<text x="255" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="255" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s2 · m2</text>
<text x="255" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="255" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="306" y="120" width="82" height="110" rx="4" fill="#e6efff" stroke="#7b8794" stroke-width="1"/>
<text x="347" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 3</text>
<text x="347" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="347" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s3 · m3</text>
<text x="347" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="347" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="398" y="120" width="82" height="110" rx="4" fill="#fffdf8" stroke="#7b8794" stroke-width="1"/>
<text x="439" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 4</text>
<text x="439" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="439" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s4 · m4</text>
<text x="439" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="439" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="490" y="120" width="82" height="110" rx="4" fill="#e6efff" stroke="#7b8794" stroke-width="1"/>
<text x="531" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 5</text>
<text x="531" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="531" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s5 · m5</text>
<text x="531" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="531" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="582" y="120" width="82" height="110" rx="4" fill="#fffdf8" stroke="#7b8794" stroke-width="1"/>
<text x="623" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 6</text>
<text x="623" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="623" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s6 · m6</text>
<text x="623" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="623" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<rect x="674" y="120" width="82" height="110" rx="4" fill="#e6efff" stroke="#7b8794" stroke-width="1"/>
<text x="715" y="140" font-size="12" text-anchor="middle" fill="#1f2933">子块 7</text>
<text x="715" y="160" font-size="11" text-anchor="middle" fill="#52606d">32 值</text>
<text x="715" y="180" font-size="11" text-anchor="middle" fill="#b91c1c">s7 · m7</text>
<text x="715" y="200" font-size="11" text-anchor="middle" fill="#52606d">q[0..31]</text>
<text x="715" y="218" font-size="10" text-anchor="middle" fill="#7b8794">6-bit</text>
<text x="20" y="275" font-size="12" fill="#1f2933">反量化：y = d · s_j · q − dmin · m_j（解码直接乘整数，/63 已折进 d）</text>
<text x="20" y="295" font-size="12" fill="#52606d">qs 交错：低半字节归偶数子块、高半字节归奇数子块（每 32 字节一轮）</text>
</svg>