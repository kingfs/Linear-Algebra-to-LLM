module: M06
questions:
  # ---------- 6.1 特征值与特征向量 ----------
  - id: q-6.1-001
    concept: "6.1"
    section: 5
    type: numeric
    difficulty: 1
    stem: '矩阵 $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$ 的最大特征值是多少？'
    answer: 3
    tolerance: 0.001
    explanation: '$\operatorname{tr}(A)=4$、$\det(A)=3$，特征多项式 $\lambda^2-4\lambda+3=(\lambda-3)(\lambda-1)$，所以最大特征值是 $3$。'
    source: "06-特征值/01-特征值与特征向量.md#5-例子"
    tags: [特征值, 手算]

  - id: q-6.1-002
    concept: "6.1"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '特征值的定义中为什么要求特征向量 $\mathbf{v}\neq\mathbf{0}$？'
    options:
      - '否则 $A-\lambda I$ 一定可逆'
      - '否则特征值一定是 $0$'
      - '否则零向量没有方向，且 $A\mathbf{0}=\lambda\mathbf{0}$ 对任意 $\lambda$ 成立，特征值失去区分能力'
      - '否则特征向量不能乘以非零常数'
    answer: [2]
    explanation: '若允许零向量，任何 $\lambda$ 都满足方程，$\lambda$ 就不再由矩阵决定；零向量也没有方向，谈不上「方向不变」。'
    source: "06-特征值/01-特征值与特征向量.md#2-定义"
    tags: [定义, 特征向量]

  - id: q-6.1-003
    concept: "6.1"
    section: 6
    type: true_false
    difficulty: 1
    stem: '特征值一定是大于 $1$ 的放大倍数，所以每个特征值都满足 $|\lambda|>1$。'
    answer: false
    explanation: '特征值可以为 $0$（方向被压成零）、负数（反向）、模小于 $1$（收缩），实矩阵还可能有复特征值（旋转）。'
    source: "06-特征值/01-特征值与特征向量.md#6-常见误区"
    tags: [误区, 特征值]

  - id: q-6.1-004
    concept: "6.1"
    section: 8
    type: single_choice
    difficulty: 2
    stem: '把残差流线性化为 $\mathbf{h}_{t+1}=W\mathbf{h}_t$。若 $W$ 的谱半径为 $1.1$，走 $100$ 步后信号的尺度大致如何变化？'
    options:
      - '基本保持不变'
      - '放大约 $1.38\times10^4$ 倍'
      - '缩小到约 $2.7\times10^{-5}$'
      - '严格按 $100\times1.1$ 线性增长'
    answer: [1]
    explanation: '$1.1^{100}\approx1.38\times10^4$；谱半径大于 $1$ 的模式会指数增长，这正是深层残差流尺度漂移的来源。'
    source: "06-特征值/01-特征值与特征向量.md#8-通往大模型稳定性由谱半径决定"
    tags: [谱半径, 大模型, 稳定性]

  # ---------- 6.2 特征多项式、迹与行列式 ----------
  - id: q-6.2-001
    concept: "6.2"
    section: 5
    type: numeric
    difficulty: 1
    stem: '一个 $3\times3$ 矩阵的迹为 $6$、行列式为 $6$，已知两个特征值是 $1$ 和 $2$，第三个特征值是多少？'
    answer: 3
    tolerance: 0.001
    explanation: '特征值之和等于迹：$1+2+\lambda_3=6$，故 $\lambda_3=3$；再用 $1\cdot2\cdot3=6=\det(A)$ 校验。'
    source: "06-特征值/02-特征多项式与迹.md#5-例子"
    tags: [迹, 行列式, 手算]

  - id: q-6.2-002
    concept: "6.2"
    section: 5
    type: single_choice
    difficulty: 2
    stem: '矩阵 $A=\begin{bmatrix}1&1\\0&1\end{bmatrix}$ 的特征值 $1$ 的代数重数与几何重数分别是多少？'
    options:
      - '代数重数 $1$，几何重数 $2$'
      - '两者都是 $2$'
      - '代数重数 $2$，几何重数 $1$'
      - '两者都是 $1$'
    answer: [2]
    explanation: '$p_A(\lambda)=(\lambda-1)^2$，故代数重数为 $2$；$A-I=\begin{bmatrix}0&1\\0&0\end{bmatrix}$ 的秩为 $1$，几何重数 $2-1=1$。'
    source: "06-特征值/02-特征多项式与迹.md#5-例子"
    tags: [代数重数, 几何重数]

  - id: q-6.2-003
    concept: "6.2"
    section: 6
    type: true_false
    difficulty: 2
    stem: '矩阵的迹等于其不同特征值之和（每个不同特征值只计一次）。'
    answer: false
    explanation: '要按代数重数计；例如 $\begin{bmatrix}1&1\\0&1\end{bmatrix}$ 的特征值是 $1,1$，迹为 $2$，而不是只算一个 $1$。'
    source: "06-特征值/02-特征多项式与迹.md#6-常见误区"
    tags: [迹, 误区, 重数]

  - id: q-6.2-004
    concept: "6.2"
    section: 5
    type: numeric
    difficulty: 1
    stem: '矩阵 $A=\begin{bmatrix}4&1\\2&3\end{bmatrix}$ 的较大特征值是多少？'
    answer: 5
    tolerance: 0.001
    explanation: '$\operatorname{tr}(A)=7$、$\det(A)=10$，故 $p_A(\lambda)=\lambda^2-7\lambda+10=(\lambda-5)(\lambda-2)$。'
    source: "06-特征值/02-特征多项式与迹.md#5-例子"
    tags: [特征多项式, 手算]

  - id: q-6.2-005
    concept: "6.2"
    section: 6
    type: single_choice
    difficulty: 1
    stem: '若 $\det(A)=0$，下列哪项一定成立？'
    options:
      - '$A$ 没有特征值'
      - '$A$ 的所有特征值都是 $0$'
      - '$A$ 一定可对角化'
      - '$0$ 是 $A$ 的特征值，且 $A$ 不可逆'
    answer: [3]
    explanation: '$\det(A)=0$ 说明 $A$ 奇异，存在非零 $\mathbf{v}$ 使 $A\mathbf{v}=\mathbf{0}$，即 $0$ 是特征值；其它特征值未必为 $0$。'
    source: "06-特征值/02-特征多项式与迹.md#6-常见误区"
    tags: [行列式, 误区, 奇异矩阵]

  # ---------- 6.3 对角化 ----------
  - id: q-6.3-001
    concept: "6.3"
    section: 5
    type: numeric
    difficulty: 2
    stem: '对 $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$，$A^{10}$ 的左上角元素是多少？'
    answer: 29525
    tolerance: 0.001
    explanation: '特征值为 $3,1$，$A^{10}=P\operatorname{diag}(3^{10},1)P^{-1}$，左上角为 $(3^{10}+1)/2=(59049+1)/2=29525$。'
    source: "06-特征值/03-对角化.md#5-例子"
    tags: [对角化, 矩阵幂, 手算]

  - id: q-6.3-002
    concept: "6.3"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '$n\times n$ 矩阵 $A$ 可对角化，当且仅当下列哪条成立？'
    options:
      - '$A$ 有 $n$ 个互不相同的特征值'
      - '$A$ 有 $n$ 个线性无关的特征向量'
      - '$A$ 是对称矩阵'
      - '$\det(A)\neq0$'
    answer: [1]
    explanation: '把 $n$ 个线性无关特征向量按列拼成 $P$，就有 $AP=PD$；互异特征值只是充分条件，对称矩阵也只是特例。'
    source: "06-特征值/03-对角化.md#2-定义"
    tags: [对角化, 等价条件]

  - id: q-6.3-003
    concept: "6.3"
    section: 4
    type: true_false
    difficulty: 1
    stem: '若 $n\times n$ 矩阵有 $n$ 个互不相同的特征值，则它一定可对角化。'
    answer: true
    explanation: '互异特征值对应的特征向量线性无关，正好凑成 $\mathbb{R}^n$ 的一组基，因此 $P$ 可逆。这是充分不必要条件。'
    source: "06-特征值/03-对角化.md#4-性质与推导"
    tags: [对角化, 互异特征值]

  - id: q-6.3-004
    concept: "6.3"
    section: 2
    type: multiple_choice
    difficulty: 2
    stem: '下列哪些矩阵可对角化？'
    options:
      - '$\begin{bmatrix}2&0&0\\0&2&0\\0&0&5\end{bmatrix}$'
      - '$\begin{bmatrix}2&1&0\\0&2&0\\0&0&5\end{bmatrix}$'
      - '$\begin{bmatrix}1&1\\0&1\end{bmatrix}$'
      - '$\begin{bmatrix}2&1\\1&2\end{bmatrix}$'
    answer: [0, 3]
    explanation: '第一个已经是对角阵；第四个有两个互异特征值 $3,1$。第二、三个在重特征值处几何重数小于代数重数，不可对角化。'
    source: "06-特征值/03-对角化.md#2-定义"
    tags: [对角化, 几何重数]

  - id: q-6.3-005
    concept: "6.3"
    section: 6
    type: true_false
    difficulty: 1
    stem: '只要算出 $n$ 个特征值（计重数），就一定能对角化。'
    answer: false
    explanation: '还要看重特征值的几何重数；$\begin{bmatrix}1&1\\0&1\end{bmatrix}$ 有特征值 $1,1$，但几何重数只有 $1$，不可对角化。'
    source: "06-特征值/03-对角化.md#6-常见误区"
    tags: [误区, 对角化, 几何重数]

  # ---------- 6.4 对称矩阵与谱定理 ----------
  - id: q-6.4-001
    concept: "6.4"
    section: 4
    type: numeric
    difficulty: 2
    stem: '对 $A=\begin{bmatrix}2&2\\2&-1\end{bmatrix}$，在 $\mathbf{x}=(1,0)$ 处的 Rayleigh 商 $R(\mathbf{x})=\frac{\mathbf{x}^\top A\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}$ 是多少？'
    answer: 2
    tolerance: 0.001
    explanation: '$\mathbf{x}^\top A\mathbf{x}=a_{11}=2$，$\mathbf{x}^\top\mathbf{x}=1$，故 $R=2$；它落在 $[\lambda_{\min},\lambda_{\max}]=[-2,3]$ 内。'
    source: "06-特征值/04-对称矩阵与谱定理.md#4-性质与推导"
    tags: [Rayleigh 商, 手算]

  - id: q-6.4-002
    concept: "6.4"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '对实对称矩阵 $A$，谱定理保证下列哪条成立？'
    options:
      - '所有特征值都大于 $0$'
      - '存在可逆 $P$ 使 $A=PDP^{-1}$，但 $P$ 一般不正交'
      - '存在正交矩阵 $Q$ 和实对角矩阵 $\Lambda$，使 $A=Q\Lambda Q^\top$'
      - '$A$ 一定可逆'
    answer: [2]
    explanation: '谱定理给出标准正交特征基，$Q^\top Q=I$；特征值可正可负，矩阵也可以奇异。'
    source: "06-特征值/04-对称矩阵与谱定理.md#2-定义"
    tags: [谱定理, 正交对角化]

  - id: q-6.4-003
    concept: "6.4"
    section: 6
    type: true_false
    difficulty: 2
    stem: '实对称矩阵的任意两个特征向量都正交。'
    answer: false
    explanation: '只有属于不同特征值的特征向量自动正交；同一重特征值的特征空间内部需要自己正交化，例如 $I$ 的任意两个特征向量都可以不正交。'
    source: "06-特征值/04-对称矩阵与谱定理.md#6-常见误区"
    tags: [误区, 正交性]

  - id: q-6.4-004
    concept: "6.4"
    section: 2
    type: multiple_choice
    difficulty: 2
    stem: '关于实对称矩阵，下列哪些说法正确？'
    options:
      - '特征值全是实数'
      - '不同特征值的特征向量自动正交'
      - '一定可逆'
      - '正交对角化中的 $Q$ 唯一'
    answer: [0, 1]
    explanation: '前两条是谱定理的核心结论；对称矩阵可以有 $0$ 特征值因而不一定可逆，$Q$ 在重特征值或整体变号下不唯一。'
    source: "06-特征值/04-对称矩阵与谱定理.md#2-定义"
    tags: [谱定理, 特征值]

  # ---------- 6.5 二次型与正定 ----------
  - id: q-6.5-001
    concept: "6.5"
    section: 6
    type: true_false
    difficulty: 1
    stem: '只要矩阵的主对角元都为正，它就是正定矩阵。'
    answer: false
    explanation: '交叉项可能破坏正定性：$\begin{bmatrix}1&2\\2&1\end{bmatrix}$ 的对角元全为正，特征值却是 $3,-1$，不定。'
    source: "06-特征值/05-二次型与正定.md#6-常见误区"
    tags: [误区, 正定]

  - id: q-6.5-002
    concept: "6.5"
    section: 5
    type: numeric
    difficulty: 2
    stem: '设 $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$，损失 $f(\mathbf{x})=\mathbf{x}^\top A\mathbf{x}-2\mathbf{b}^\top\mathbf{x}$ 的 Hessian 为 $2A$。梯度下降的稳定步长上限 $2/\lambda_{\max}(2A)$ 是多少？'
    answer: 0.3333
    tolerance: 0.001
    explanation: '$A$ 的特征值为 $3,1$，故 $2A$ 的特征值为 $6,2$，上限为 $2/6=1/3\approx0.3333$。'
    source: "06-特征值/05-二次型与正定.md#5-例子"
    tags: [正定, 学习率, 大模型]

  - id: q-6.5-003
    concept: "6.5"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '判断对称矩阵 $A$ 正定的 Sylvester 判据是下列哪一条？'
    options:
      - '所有顺序主子式都大于 $0$'
      - '所有对角元都大于 $0$'
      - '所有元素都大于 $0$'
      - '只要 $\det(A)>0$ 即可'
    answer: [0]
    explanation: '正定要求左上角每个 $k\times k$ 子矩阵的行列式 $\Delta_k>0$；对角元或单个行列式为正都不够。'
    source: "06-特征值/05-二次型与正定.md#2-定义"
    tags: [Sylvester 判据, 正定]

  - id: q-6.5-004
    concept: "6.5"
    section: 5
    type: multiple_choice
    difficulty: 2
    stem: '下列哪些矩阵是正定的？'
    options:
      - '$\begin{bmatrix}2&-1\\-1&2\end{bmatrix}$'
      - '$\begin{bmatrix}1&2\\2&1\end{bmatrix}$'
      - '$\begin{bmatrix}2&1\\1&2\end{bmatrix}$'
      - '$\begin{bmatrix}1&1\\1&1\end{bmatrix}$'
    answer: [0, 2]
    explanation: '第一、三个的特征值都是 $3,1$；第二个特征值为 $3,-1$，不定；第四个特征值为 $2,0$，只是半正定。'
    source: "06-特征值/05-二次型与正定.md#5-例子"
    tags: [正定, 特征值]

  - id: q-6.5-005
    concept: "6.5"
    section: 6
    type: true_false
    difficulty: 1
    stem: '半正定矩阵一定可逆。'
    answer: false
    explanation: '半正定允许 $0$ 特征值，此时矩阵奇异；只有正定矩阵才保证所有特征值严格为正、从而可逆。'
    source: "06-特征值/05-二次型与正定.md#6-常见误区"
    tags: [误区, 半正定]

  # ---------- 6.6 幂迭代与 PageRank ----------
  - id: q-6.6-001
    concept: "6.6"
    section: 5
    type: numeric
    difficulty: 1
    stem: '对 $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$ 做幂迭代，收敛比 $|\lambda_2/\lambda_1|$ 是多少？'
    answer: 0.3333
    tolerance: 0.001
    explanation: '特征值为 $3,1$，收敛比为 $1/3\approx0.3333$：副特征方向每步相对缩小到三分之一。'
    source: "06-特征值/06-幂迭代与PageRank.md#5-例子"
    tags: [幂迭代, 收敛比]

  - id: q-6.6-002
    concept: "6.6"
    section: 4
    type: numeric
    difficulty: 2
    stem: '幂迭代的收敛比为 $0.5$，要把初始误差缩小到 $10^{-3}$，大约需要多少步？'
    answer: 10
    tolerance: 0.5
    explanation: '$0.5^k\le10^{-3}$，$k\approx\log(10^{-3})/\log(0.5)\approx9.97$，取 $10$ 步。'
    source: "06-特征值/06-幂迭代与PageRank.md#4-性质与推导"
    tags: [幂迭代, 迭代次数]

  - id: q-6.6-003
    concept: "6.6"
    section: 6
    type: single_choice
    difficulty: 1
    stem: '一次幂迭代最多能给出什么？'
    options:
      - '矩阵的全部特征值'
      - '模最小的特征值'
      - '矩阵的行列式'
      - '模最大的特征值及其特征向量'
    answer: [3]
    explanation: '幂迭代让主特征方向在反复乘 $A$ 后占据主导；其它特征值需要位移、收缩或 QR 迭代。'
    source: "06-特征值/06-幂迭代与PageRank.md#6-常见误区"
    tags: [幂迭代, 主特征值]

  - id: q-6.6-004
    concept: "6.6"
    section: 5
    type: numeric
    difficulty: 3
    stem: '对文档中的三节点 PageRank，取 $d=0.85$，平稳分布的第一个分量 $a$ 约为多少？'
    answer: 0.3878
    tolerance: 0.005
    explanation: '由 $a=0.05+0.85c$ 等方程解得 $a=0.128625/0.3316875\approx0.3878$，三个分量之和为 $1$。'
    source: "06-特征值/06-幂迭代与PageRank.md#5-例子"
    tags: [PageRank, 平稳分布, 手算]

  - id: q-6.6-005
    concept: "6.6"
    section: 6
    type: true_false
    difficulty: 2
    stem: '幂迭代的收敛步数只取决于矩阵的阶数 $n$。'
    answer: false
    explanation: '步数由谱隙决定，约 $k\approx\log\varepsilon/\log|\lambda_2/\lambda_1|$，与 $n$ 没有直接关系。'
    source: "06-特征值/06-幂迭代与PageRank.md#6-常见误区"
    tags: [误区, 收敛速度]

  # ---------- 6.7 Jordan 标准形与矩阵函数 ----------
  - id: q-6.7-001
    concept: "6.7"
    section: 5
    type: numeric
    difficulty: 2
    stem: '对 $A=\begin{bmatrix}1&1\\0&1\end{bmatrix}$，$A^5$ 的右上角元素是多少？'
    answer: 5
    tolerance: 0.001
    explanation: '$A=I+N$、$N^2=0$，故 $A^k=I+kN=\begin{bmatrix}1&k\\0&1\end{bmatrix}$，取 $k=5$。'
    source: "06-特征值/07-Jordan与矩阵函数.md#5-例子"
    tags: [Jordan 块, 矩阵幂, 手算]

  - id: q-6.7-002
    concept: "6.7"
    section: 5
    type: numeric
    difficulty: 2
    stem: '对 $A=\begin{bmatrix}1&1\\0&1\end{bmatrix}$，$e^{At}$ 在 $t=1$ 时的右上角元素约为多少？'
    answer: 2.718
    tolerance: 0.01
    explanation: '$e^{At}=e^t\begin{bmatrix}1&t\\0&1\end{bmatrix}$，故 $t=1$ 时右上角为 $e\approx2.718$。'
    source: "06-特征值/07-Jordan与矩阵函数.md#5-例子"
    tags: [矩阵指数, 手算]

  - id: q-6.7-003
    concept: "6.7"
    section: 6
    type: true_false
    difficulty: 1
    stem: '特征值重复的矩阵一定不可对角化。'
    answer: false
    explanation: '例如 $2I$ 的特征值 $2$ 重数为 $2$，但任意两个线性无关向量都是特征向量，它本身已是对角阵；要看几何重数是否等于代数重数。'
    source: "06-特征值/07-Jordan与矩阵函数.md#6-常见误区"
    tags: [误区, Jordan 块]

  - id: q-6.7-004
    concept: "6.7"
    section: 5
    type: single_choice
    difficulty: 3
    stem: '对 $A=\begin{bmatrix}-1&100\\0&-1\end{bmatrix}$，只看特征值会得到什么错误结论？'
    options:
      - '系统会周期振荡'
      - '特征值是复数，所以系统不稳定'
      - '所有特征值实部为负，范数应单调衰减；但 $\|e^{At}\|_2$ 会先增到约 $37$ 再衰减'
      - '矩阵不可对角化，所以 $e^{At}$ 不存在'
    answer: [2]
    explanation: '这是非正规矩阵的瞬态增长：$e^{At}=e^{-t}\begin{bmatrix}1&100t\\0&1\end{bmatrix}$，$t\approx1$ 时范数约 $36.8$，之后才指数衰减。'
