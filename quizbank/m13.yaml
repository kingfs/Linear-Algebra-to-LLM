module: M13
questions:
  - id: q-13.1-001
    concept: "13.1"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '7B 模型在 decode 阶段的主要瓶颈通常是？'
    options:
      - '算力（FLOPs）'
      - '显存带宽（bytes/s）'
      - '网络带宽'
      - '磁盘 IO'
    answer: [1]
    explanation: 'decode 每步只处理 1 个 token，算术强度很低；每生成一个 token 都要读权重和 KV，所以瓶颈在显存带宽，而不是算力。'
    source: "13-推理服务/01-推理的数学.md#2-定义"
    tags: [decode, 带宽, roofline]

  - id: q-13.1-002
    concept: "13.1"
    section: 4
    type: true_false
    difficulty: 2
    stem: '把 KV Cache 量化到 int8（约 2× 压缩），端到端解码速度一定提升 2×。'
    answer: false
    explanation: '量化只减少字节，不减少 FLOPs；收益上限是“省下的字节 ÷ 总读取字节”。短上下文时权重占大头，KV 量化收益很小；长上下文时才接近 2×。'
    source: "13-推理服务/01-推理的数学.md#4-性质与推导"
    tags: [量化, KV Cache, 收益边界]

  - id: q-13.1-003
    concept: "13.1"
    section: 5
    type: numeric
    difficulty: 2
    stem: '7B 模型 fp16 权重约 14 GB，HBM 带宽 2 TB/s。忽略 KV 与其他开销，decode 每 token 的理论下限是多少毫秒？'
    answer: 7
    tolerance: 0.1
    explanation: '$14\ \text{GB}/2000\ \text{GB/s}=0.007\ \text{s}=7\ \text{ms}$；对应单请求上限约 143 token/s。'
    source: "13-推理服务/01-推理的数学.md#5-例子"
    tags: [decode, 带宽, 估算]

  - id: q-13.1-004
    concept: "13.1"
    section: 4
    type: multiple_choice
    difficulty: 2
    stem: '下列哪些做法会降低 decode 阶段“每 token 需要读取的字节数”？'
    options:
      - '把权重从 fp16 量化到 int8'
      - '把 KV Cache 量化到 int8'
      - '使用 GQA，减少 KV 头数'
      - '增大 batch size'
    answer: [0, 1, 2]
    explanation: '权重/ KV 量化直接减少字节；GQA 减少 KV 头数，也减少 KV 字节。增大 batch 会摊薄权重读取、提高总吞吐，但不会降低“每 token 读取的字节数”这个单请求指标。'
    source: "13-推理服务/01-推理的数学.md#4-性质与推导"
    tags: [量化, GQA, batching]

  - id: q-13.2-001
    concept: "13.2"
    section: 2
    type: single_choice
    difficulty: 1
    stem: 'GGUF 是什么？'
    options:
      - '一种 4-bit 量化算法'
      - '一种模型容器格式，可装不同量化类型'
      - '一种 KV Cache 精度'
      - '一种 GPU kernel'
    answer: [1]
    explanation: 'GGUF 是容器，包含 metadata、tokenizer 和 tensor；同一个 GGUF 可以是 F16、Q8_0、Q4_K_M 或 IQ2_XS。'
    source: "13-推理服务/02-模型格式与量化.md#2-定义"
    tags: [GGUF, 容器, 量化]

  - id: q-13.2-002
    concept: "13.2"
    section: 4
    type: true_false
    difficulty: 2
    stem: 'Q4_K_M 的每个权重都严格用 4 bit 存储。'
    answer: false
    explanation: 'Q4_K_M 是混合 K-quant：主体约 4-bit，但包含更细的 scale、部分 Q6_K tensor、元数据/对齐，所以有效 bpw 约 5。'
    source: "13-推理服务/02-模型格式与量化.md#4-性质与推导"
    tags: [Q4_K_M, bpw, 混合精度]

  - id: q-13.2-003
    concept: "13.2"
    section: 5
    type: numeric
    difficulty: 2
    stem: '1.7B 模型，Q4_K_M 文件 1.10 GB（十进制）。有效 bpw 大约是多少？'
    answer: 5.1
    tolerance: 0.2
    explanation: '$1.10\times10^9\times8/(1.73\times10^9)\approx5.1$ bpw；多出来的是 scale、混合精度和 metadata。'
    source: "13-推理服务/02-模型格式与量化.md#5-例子"
    tags: [bpw, Q4_K_M, 估算]

  - id: q-13.2-004
    concept: "13.2"
    section: 2
    type: multiple_choice
    difficulty: 2
    stem: '下列哪些会减少权重读取字节？'
    options:
      - 'Q4_K_M'
      - 'AWQ 4-bit'
      - 'FP8'
      - 'FP16'
    answer: [0, 1, 2]
    explanation: 'Q4_K_M、AWQ 4-bit、FP8 都比 FP16 更少字节；FP16 是基准，不减少。'
    source: "13-推理服务/02-模型格式与量化.md#2-定义"
    tags: [量化, 权重, 字节]

  - id: q-13.3-001
    concept: "13.3"
    section: 2
    type: single_choice
    difficulty: 1
    stem: '一次 chat 请求在引擎里的典型顺序是？'
    options:
      - 'decode → prefill → tokenize → 采样'
      - 'tokenize/template → 调度 → prefill → decode → detokenize'
      - 'prefill → 调度 → tokenize → decode'
      - '采样 → tokenize → prefill → detokenize'
    answer: [1]
    explanation: '请求先套模板并 tokenize，再由调度器分配 slot/KV，prefill 整段 prompt，然后逐 token decode，最后 detokenize/流式返回。'
    source: "13-推理服务/03-引擎解剖.md#2-定义"
    tags: [请求生命周期, 引擎]

  - id: q-13.3-002
    concept: "13.3"
    section: 4
    type: true_false
    difficulty: 2
    stem: 'PagedAttention 会减少单次请求的矩阵乘 FLOPs，所以单请求一定更快。'
    answer: false
    explanation: 'PagedAttention 主要减少 KV 碎片、提高驻留序列数/吞吐；单请求的 FLOPs 不变，单请求延迟不一定改善。'
    source: "13-推理服务/03-引擎解剖.md#4-性质与推导"
    tags: [PagedAttention, KV, 误区]

  - id: q-13.3-003
    concept: "13.3"
    section: 2
    type: multiple_choice
    difficulty: 1
    stem: '下列哪些属于推理引擎的部件？'
    options:
      - 'tokenizer'
      - 'chat template'
      - 'KV manager'
      - 'scheduler'
    answer: [0, 1, 2, 3]
    explanation: '四者都属于引擎：tokenizer 文本↔id，template 组 prompt，KV manager 管缓存，scheduler 决定 batch/顺序。'
    source: "13-推理服务/03-引擎解剖.md#2-定义"
    tags: [引擎, 组件]

  - id: q-13.3-004
    concept: "13.3"
    section: 5
    type: numeric
    difficulty: 2
    stem: '2k prompt、prefill 2,000 token/s；200 输出、decode 50 token/s。忽略排队/detokenize，总延迟约多少秒？'
    answer: 5
    tolerance: 0.2
    explanation: 'prefill 2000/2000=1 s；decode 200/50=4 s；合计 5 s。'
    source: "13-推理服务/03-引擎解剖.md#5-例子"
    tags: [延迟, 估算]

  - id: q-13.4-001
    concept: "13.4"
    section: 4
    type: single_choice
    difficulty: 1
    stem: 'Little 定律 $L=\lambda W$ 中，$L$ 表示什么？'
    options:
      - '系统里的平均请求数'
      - '单请求的 TPOT'
      - 'GPU 利用率'
      - 'KV 的字节数'
    answer: [0]
    explanation: '$L$ 是系统内平均请求数，$\lambda$ 是到达率，$W$ 是平均停留时间；10 req/s × 5 s = 50 条。'
    source: "13-推理服务/04-调度与并发.md#4-性质与推导"
    tags: [Little定律, 并发]

  - id: q-13.4-002
    concept: "13.4"
    section: 4
    type: numeric
    difficulty: 2
    stem: '7B、32k、FP16 KV，每序列 16 GiB；KV 预算 64 GiB。最多几条序列同时驻留？'
    answer: 4
    tolerance: 0.1
    explanation: '$64/16=4$；超过 4 条会排队/抢占/换出。'
    source: "13-推理服务/04-调度与并发.md#4-性质与推导"
    tags: [KV预算, 并发]

  - id: q-13.4-003
    concept: "13.4"
    section: 4
    type: true_false
    difficulty: 2
    stem: 'batch 越大，单请求的 TPOT 一定越低。'
    answer: false
    explanation: 'batch 摊薄权重读取，但 KV 读取和调度开销增加，TPOT 通常变长；吞吐和延迟是交换关系。'
    source: "13-推理服务/04-调度与并发.md#4-性质与推导"
    tags: [batching, TPOT, 误区]

  - id: q-13.4-004
    concept: "13.4"
    section: 4
    type: multiple_choice
    difficulty: 2
    stem: '下列哪些场景最可能从 prefix cache 受益？'
    options:
      - 'RAG：多个请求共享同一批文档'
      - '多轮对话：共享 system prompt'
      - '每个请求都是完全不同的长 prompt'
      - '结构化输出：共享 schema'
    answer: [0, 1, 3]
    explanation: '前缀缓存要求前缀相同；RAG 文档、system prompt、固定 schema 都可能共享，完全不同的 prompt 不会命中。'
    source: "13-推理服务/04-调度与并发.md#4-性质与推导"
    tags: [prefix cache, RAG, 多轮]

  - id: q-13.5-001
    concept: "13.5"
    section: 4
    type: single_choice
    difficulty: 1
    stem: '给定模型和显卡，决定“最多几条序列同时驻留”的首要约束通常是？'
    options:
      - 'GPU 核心数'
      - 'KV 预算 ÷ 每序列 KV'
      - '磁盘容量'
      - 'CPU 主频'
    answer: [1]
    explanation: '长上下文/多并发下，KV 是主要显存开销；容量 ≈ KV 预算 ÷ 每序列 KV。'
    source: "13-推理服务/05-选型与部署.md#4-性质与推导"
    tags: [容量, KV, 选型]

  - id: q-13.5-002
    concept: "13.5"
    section: 4
    type: numeric
    difficulty: 2
    stem: '一张卡 2 元/小时，稳定 50 token/s。每百万 token 的成本约多少元？'
    answer: 11.1
    tolerance: 0.2
    explanation: '$2\times10^6/(50\times3600)\approx11.1$ 元/百万 token。'
    source: "13-推理服务/05-选型与部署.md#4-性质与推导"
    tags: [成本, TCO]

  - id: q-13.5-003
    concept: "13.5"
    section: 4
    type: true_false
    difficulty: 2
    stem: '只要增加 GPU 数量，单请求延迟一定会降低。'
    answer: false
    explanation: '多卡要过 TP/PP 通信；单请求低延迟场景经常不如单卡，收益取决于并行方式和负载。'
    source: "13-推理服务/05-选型与部署.md#4-性质与推导"
    tags: [多卡, 延迟, 误区]

  - id: q-13.5-004
    concept: "13.5"
    section: 4
    type: multiple_choice
    difficulty: 1
    stem: 'API 网关通常负责哪些事情？'
    options:
      - '鉴权'
      - '限流'
      - '路由/回退'
      - '观测/日志'
    answer: [0, 1, 2, 3]
    explanation: '网关负责鉴权、限流、路由/回退、观测/日志；不要直接暴露引擎端口。'
    source: "13-推理服务/05-选型与部署.md#4-性质与推导"
    tags: [网关, 部署, 安全]

  - id: q-13.6-001
    concept: "13.6"
    section: 5
    type: single_choice
    difficulty: 1
    stem: 'LFM3 在 32k 后开始复读，第一步最该查什么？'
    options:
      - '换一个更大的模型'
      - '`ollama ps` 里的 `context_length` 与日志截断'
      - '把 temperature 调到 0'
      - '重装系统'
    answer: [1]
    explanation: '32k 正好是 Ollama 在 24–48 GB 显存档位的默认上下文；先确认运行时给了多少上下文，再看截断/context shift。'
    source: "13-推理服务/06-诊断实验.md#5-例子"
    tags: [复读, 上下文, 诊断]

  - id: q-13.6-002
    concept: "13.6"
    section: 4
    type: true_false
    difficulty: 2
    stem: '遇到 OOM，最有效的第一步永远是加一张显卡。'
    answer: false
    explanation: '先算 KV × 并发；降上下文、KV 量化、降并发往往更便宜；加卡不一定解决 KV 预算问题。'
    source: "13-推理服务/06-诊断实验.md#4-性质与推导"
    tags: [OOM, KV, 诊断]

  - id: q-13.6-003
    concept: "13.6"
    section: 5
    type: numeric
    difficulty: 2
    stem: '7B、32k、FP16 KV，每序列 16 GiB；4 并发需要多少 GiB KV？'
    answer: 64
    tolerance: 0.5
    explanation: '$16\times4=64$ GiB；24 GB 卡必 OOM。'
    source: "13-推理服务/06-诊断实验.md#5-例子"
    tags: [OOM, KV, 并发]

  - id: q-13.6-004
    concept: "13.6"
    section: 4
    type: multiple_choice
    difficulty: 2
    stem: 'Q4 后长文质量回退，可能的原因有哪些？'
    options:
      - '权重量化误差'
      - 'KV 量化误差'
      - 'chat template 不一致'
      - 'batch size 变大'
    answer: [0, 1, 2]
    explanation: '权重/KV 量化、模板都会影响质量；batch size 主要影响延迟/吞吐，不直接改变单请求质量。'
    source: "13-推理服务/06-诊断实验.md#4-性质与推导"
    tags: [质量回归, 量化, 模板]
